<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <!-- Background -->
  <rect width="400" height="400" fill="#1A2744" rx="2"/>

  <!-- Border -->
  <rect x="40" y="40" width="320" height="320" fill="none" stroke="#6F88A0" stroke-width="2.5" rx="2"/>

  <!-- Top horizontal rule — flush with border interior -->
  <line x1="42" y1="116" x2="358" y2="116" stroke="#6F88A0" stroke-width="1.5"/>

  <!-- HIGG wordmark -->
  <text
    x="200"
    y="180"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="76"
    fill="#FFFFFF"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="8">HIGG</text>

  <!-- PARTNERS wordmark -->
  <text
    x="200"
    y="234"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="400"
    font-size="48"
    fill="#6F88A0"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="8">PARTNERS</text>

  <!-- Bottom horizontal rule — flush with border interior -->
  <line x1="42" y1="258" x2="358" y2="258" stroke="#6F88A0" stroke-width="1.5"/>

  <!-- Tagline — well inside the border (border bottom is at y=360) -->
  <text
    x="200"
    y="302"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="400"
    font-size="12"
    fill="#6F88A0"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="2.5">LENDING TECHNOLOGY ADVISORY</text>

</svg>
